name: Release

# Fires when a tag starting with "v" is pushed. Creating a Release from the
# GitHub website (Releases -> Draft a new release -> create a new tag ->
# Publish) pushes such a tag and triggers this too. You can also run it
# manually via "Run workflow" and pick a tag as the ref.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    name: Build and publish release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can be generated

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.13"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
